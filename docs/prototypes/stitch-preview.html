<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="/favicon.png" rel="icon" type="image/png"/>
  <title>
   Parampara — Google Stitch Live Preview Hub | 28 States Craft Archive
  </title>
  <meta content="Live preview hub for Parampara's Google Stitch generated designs, dynamic hero mosaic, product pages, and interactive 28 states map." name="description"/>
  <meta content="website" property="og:type"/>
  <meta content="Parampara Heritage" property="og:site_name"/>
  <meta content="Parampara — Google Stitch Live Preview Hub | 28 States Craft Archive" property="og:title"/>
  <meta content="Live preview hub for Parampara's Google Stitch generated designs and interactive 28 states map." property="og:description"/>
  <meta content="https://assets.ls-assets.com/uploads/f24bfd2a-136d-48fa-ae0d-f0f9f79fbe67/7e4cfe35-4b17-4f27-b5bc-6f8ea447d211.webp?w=1200" property="og:image"/>
  <meta content="https://parampara.in/stitch-preview.html" property="og:url"/>
  <meta content="summary_large_image" name="twitter:card"/>
  <meta content="Parampara — Google Stitch Live Preview Hub | 28 States Craft Archive" name="twitter:title"/>
  <meta content="Live preview hub for Parampara's Google Stitch generated designs and interactive 28 states map." name="twitter:description"/>
  <meta content="https://assets.ls-assets.com/uploads/f24bfd2a-136d-48fa-ae0d-f0f9f79fbe67/7e4cfe35-4b17-4f27-b5bc-6f8ea447d211.webp?w=1200" name="twitter:image"/>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Noto+Serif:ital,wght@0,700;1,400&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <link href="css/stitch-preview.css" rel="stylesheet"/>
 </head>
 <body class="bg-stone-900 text-stone-100 min-h-screen flex flex-col overflow-hidden">
  <!-- Top Master Control Bar -->
  <header class="bg-stone-950 border-b border-stone-800 px-6 py-3 flex flex-wrap items-center justify-between gap-4 z-50 shadow-lg">
   <!-- Brand & Project Info -->
   <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-[#785600] flex items-center justify-center text-white font-bold text-base shadow-md">
     🏺
    </div>
    <div>
     <div class="flex items-center gap-2">
      <span class="font-bold text-sm tracking-tight">
       Parampara
      </span>
      <span class="text-[10px] bg-amber-500/20 text-amber-400 font-semibold px-2 py-0.5 rounded border border-amber-500/30">
       Google Stitch Preview
      </span>
     </div>
     <p class="text-[11px] text-stone-400">
      Project ID: 7930434279351176396
     </p>
    </div>
   </div>
   <!-- Screen Tabs -->
   <div class="flex items-center gap-2 bg-stone-900 p-1 rounded-xl border border-stone-800 overflow-x-auto max-w-2xl">
    <button class="tab-btn active px-3.5 py-1.5 rounded-lg text-xs font-semibold text-stone-300 hover:text-white transition-all flex items-center gap-2 whitespace-nowrap" onclick="loadScreen('hero-mosaic.html', this)">
     <i class="fa-solid fa-layer-group text-[11px]">
     </i>
     Dynamic Mosaic Hero
    </button>
    <button class="tab-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold text-stone-300 hover:text-white transition-all flex items-center gap-2 whitespace-nowrap" onclick="loadScreen('dynamic-homepage.html', this)">
     <i class="fa-solid fa-house text-[11px]">
     </i>
     Dynamic Full Homepage
    </button>
    <button class="tab-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold text-stone-300 hover:text-white transition-all flex items-center gap-2 whitespace-nowrap" onclick="loadScreen('product-jaipur-pottery.html', this)">
     <i class="fa-solid fa-gem text-[11px]">
     </i>
     Jaipur Pottery Product
    </button>
    <button class="tab-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold text-stone-300 hover:text-white transition-all flex items-center gap-2 whitespace-nowrap" onclick="loadScreen('index.html', this)">
     <i class="fa-solid fa-map-location-dot text-[11px]">
     </i>
     Original 28 States Map
    </button>
   </div>
   <!-- Viewport Mode & Direct Link -->
   <div class="flex items-center gap-3">
    <div class="hidden sm:flex items-center bg-stone-900 p-1 rounded-lg border border-stone-800 text-xs">
     <button class="device-btn active px-2.5 py-1 rounded text-stone-400 hover:text-white transition-all" onclick="setDevice('100%', this)" title="Desktop View">
      <i class="fa-solid fa-desktop">
      </i>
     </button>
     <button class="device-btn px-2.5 py-1 rounded text-stone-400 hover:text-white transition-all" onclick="setDevice('768px', this)" title="Tablet View">
      <i class="fa-solid fa-tablet-screen-button">
      </i>
     </button>
     <button class="device-btn px-2.5 py-1 rounded text-stone-400 hover:text-white transition-all" onclick="setDevice('390px', this)" title="Mobile View">
      <i class="fa-solid fa-mobile-screen">
      </i>
     </button>
    </div>
    <a class="text-xs bg-[#785600] hover:bg-amber-700 text-white font-medium px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 shadow" href="hero-mosaic.html" id="direct-link" target="_blank">
     <span>
      Open Full Page
     </span>
     <i class="fa-solid fa-arrow-up-right-from-square text-[10px]">
     </i>
    </a>
   </div>
  </header>
  <!-- Canvas Preview Container -->
  <main class="flex-1 bg-stone-900 p-2 sm:p-3 flex items-center justify-center overflow-hidden" style="height: calc(100vh - 65px);">
   <div class="w-full h-full max-w-full bg-white rounded-xl overflow-hidden shadow-2xl transition-all duration-300 border border-stone-800 flex flex-col" id="frame-wrapper">
    <iframe class="w-full h-full flex-1 border-0" frameborder="0" id="preview-frame" src="hero-mosaic.html" style="min-height: 100%;">
    </iframe>
   </div>
  </main>
  <script>
   function loadScreen(url, btn) {
            document.getElementById('preview-frame').src = url;
            document.getElementById('direct-link').href = url;
            
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }

        function setDevice(width, btn) {
            const wrapper = document.getElementById('frame-wrapper');
            wrapper.style.maxWidth = width;
            
            document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }
  </script>
 </body>
</html>
