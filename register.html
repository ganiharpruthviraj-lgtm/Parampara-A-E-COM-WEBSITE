<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="/favicon.png" rel="icon" type="image/png"/>
  <title>
   Join the Legacy | Create Account | Parampara Heritage
  </title>
  <meta content="Create your Parampara account to save, collect, and preserve authentic Indian heritage masterpieces from all 28 states of India." name="description"/>
  <meta content="website" property="og:type"/>
  <meta content="Parampara Heritage" property="og:site_name"/>
  <meta content="Join the Legacy | Create Account | Parampara Heritage" property="og:title"/>
  <meta content="Create your Parampara account to save, collect, and preserve authentic Indian heritage masterpieces from all 28 states of India." property="og:description"/>
  <meta content="https://assets.ls-assets.com/uploads/f24bfd2a-136d-48fa-ae0d-f0f9f79fbe67/7e4cfe35-4b17-4f27-b5bc-6f8ea447d211.webp?w=1200" property="og:image"/>
  <meta content="https://parampara.in/register.html" property="og:url"/>
  <meta content="summary_large_image" name="twitter:card"/>
  <meta content="Join the Legacy | Create Account | Parampara Heritage" name="twitter:title"/>
  <meta content="Create your Parampara account to save, collect, and preserve authentic Indian heritage masterpieces from all 28 states." name="twitter:description"/>
  <meta content="https://assets.ls-assets.com/uploads/f24bfd2a-136d-48fa-ae0d-f0f9f79fbe67/7e4cfe35-4b17-4f27-b5bc-6f8ea447d211.webp?w=1200" name="twitter:image"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&amp;family=Sora:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js">
  </script>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <script async="" defer="" src="https://accounts.google.com/gsi/client">
  </script>
  <link href="css/register.css" rel="stylesheet"/>
 </head>
 <body>
  <div id="toast">
  </div>
  <div class="register-wrapper">
   <div class="left-panel">
    <div class="left-bg h-full">
     <img alt="Heritage" src="https://picsum.photos/seed/heritage/1200/1800" loading="lazy"/>
    </div>
    <div class="absolute inset-0 flex flex-col justify-end p-12 text-white bg-gradient-to-t from-black/80 to-transparent">
     <h2 class="text-4xl font-serif mb-4">
      Start your
      <em>
       heritage journey.
      </em>
     </h2>
     <p class="text-sm opacity-70">
      Access India's most exclusive artisanal collective.
     </p>
    </div>
   </div>
   <div class="right-panel">
    <div class="form-container">
     <a class="inline-flex items-center gap-2 text-[10px] uppercase tracking-widest text-mid hover:text-primary mb-12" href="login.html">
      <i class="fa-solid fa-arrow-left">
      </i>
      Already a member?
     </a>
     <p class="text-[10px] uppercase tracking-[0.3em] text-primary mb-2 font-bold reveal-item">
      New Account
     </p>
     <h1 class="text-5xl font-serif mb-8 reveal-item">
      Create
      <em>
       Legacy.
      </em>
     </h1>
     <form class="space-y-6" id="register-form">
      <div class="reveal-item">
       <label class="text-[10px] uppercase tracking-widest text-mid font-bold block mb-2">
        Full Name
       </label>
       <div class="relative">
        <i class="absolute left-4 top-1/2 -translate-y-1/2 fa-regular fa-user text-gray-400">
        </i>
        <input class="field-input" id="name" placeholder="Arjun Sharma" required="" type="text"/>
       </div>
      </div>
      <div class="reveal-item">
       <label class="text-[10px] uppercase tracking-widest text-mid font-bold block mb-2">
        Email Address
       </label>
       <div class="relative">
        <i class="absolute left-4 top-1/2 -translate-y-1/2 fa-regular fa-envelope text-gray-400">
        </i>
        <input class="field-input" id="email" placeholder="arjun@legacy.com" required="" type="email"/>
       </div>
      </div>
      <div class="reveal-item">
       <label class="text-[10px] uppercase tracking-widest text-mid font-bold block mb-2">
        Password
       </label>
       <div class="relative">
        <i class="absolute left-4 top-1/2 -translate-y-1/2 fa-regular fa-lock text-gray-400">
        </i>
        <input class="field-input" id="password" placeholder="Min. 6 characters" required="" type="password"/>
       </div>
      </div>
      <button class="btn-submit reveal-item" id="submit-btn" type="submit">
       <span id="btn-text">
        Create My Account
       </span>
      </button>
     </form>
     <div class="flex items-center gap-4 my-6 reveal-item">
      <div class="flex-1 h-px bg-[var(--border)]">
      </div>
      <span class="text-[0.6rem] font-bold tracking-[0.15em] uppercase text-[#C5BDB0]">
       Or continue with
      </span>
      <div class="flex-1 h-px bg-[var(--border)]">
      </div>
     </div>
     <div class="flex justify-center reveal-item">
      <div data-auto_prompt="false" data-callback="handleGoogleCallback" data-client_id="YOUR_GOOGLE_CLIENT_ID" data-context="signup" data-ux_mode="popup" id="g_id_onload">
      </div>
      <div class="g_id_signin" data-logo_alignment="left" data-shape="rectangular" data-size="large" data-text="signup_with" data-theme="outline" data-type="standard">
      </div>
     </div>
     <p class="text-center text-xs text-mid mt-8 reveal-item">
      By joining, you agree to our
      <a class="text-primary underline" href="#">
       Heritage Terms
      </a>
      .
     </p>
    </div>
   </div>
  </div>
  <script src="js/auth.js">
  </script>
  <script>
   gsap.fromTo(".reveal-item", { opacity: 0, y: 20 }, { opacity: 1, y: 0, stagger: 0.1, duration: 1, ease: "expo.out" });

  const cursor = document.getElementById('mag-cursor');
  const follower = document.getElementById('mag-follower');
  document.addEventListener('mousemove', e => {
      gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.1 });
      gsap.to(follower, { x: e.clientX, y: e.clientY, duration: 0.3 });
  });

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');

    btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';

    try {
      const res = await fetch(`${window.GLOBAL_API_BASE}/api/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();

      if (res.ok) {
        showToast('Welcome to the Parampara archive! 🏺');
        onAuthSuccess(data); // Global helper
        const redirect = localStorage.getItem('redirectAfterLogin') || 'index.html';
        localStorage.removeItem('redirectAfterLogin');
        setTimeout(() => window.location.href = redirect, 1500);
      } else {
        throw new Error(data.message || 'Error creating account');
      }
    } catch (err) {
      console.warn('API Offline, using demo fallback:', err.message);
      
      const demoUser = { name, email, token: 'demo-' + Date.now() };
      showToast('Backend offline. Joining Archive as Heritage Guest! 🏺');
      
      setTimeout(() => {
          onAuthSuccess(demoUser);
          const redirect = localStorage.getItem('redirectAfterLogin') || 'index.html';
          localStorage.removeItem('redirectAfterLogin');
          window.location.href = redirect;
      }, 1500);
    }
  });

  async function handleGoogleCallback(response) {
      const token = response.credential;
      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      
      if (btnText) btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Google Account processing...';

      try {
        const res = await fetch(`${window.GLOBAL_API_BASE}/api/auth/google`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token })
        });
        const data = await res.json();
        
        if (res.ok) {
            onAuthSuccess(data);
            showToast('Google API joined successfully!');
            setTimeout(() => {
                const redirect = localStorage.getItem('redirectAfterLogin') || 'index.html';
                localStorage.removeItem('redirectAfterLogin');
                window.location.href = redirect;
            }, 1000);
        } else {
            throw new Error(data.message || 'Google Auth Failed');
        }
      } catch(err) {
        console.error(err);
        showToast('Google Sign-In Failed: ' + err.message);
        if (btnText) btnText.innerHTML = 'Create My Account';
      }
  }
  </script>
  <script src="js/nav.js">
  </script>
 </body>
</html>
