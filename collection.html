  <meta content="https://assets.ls-assets.com/uploads/f24bfd2a-136d-48fa-ae0d-f0f9f79fbe67/7e4cfe35-4b17-4f27-b5bc-6f8ea447d211.webp?w=1200" name="twitter:image"/>

 </head>
 <body class="flex flex-col min-h-screen">
  <!-- Header -->
  <header class="code-section" id="global-header">
   <nav class="bg-[#FBF9F4] border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
     <div class="flex justify-between items-center h-20">
      <a class="flex items-center" href="index.html">
       <img alt="Parampara Logo" class="h-12 w-auto" src="https://assets.ls-assets.com/uploads/f24bfd2a-136d-48fa-ae0d-f0f9f79fbe67/7e4cfe35-4b17-4f27-b5bc-6f8ea447d211.webp?w=768" loading="lazy"/>
      </a>
      <div class="hidden lg:flex items-center space-x-8">
       <a class="text-gray-800 hover:text-[#B8860B] font-medium transition-colors" href="states.html">
        All States
       </a>
       <a class="text-gray-800 hover:text-[#B8860B] font-medium transition-colors" href="artisans.html">
        Our Artisans
       </a>
       <a class="bg-[#B8860B] text-white px-6 py-3 rounded-full font-semibold hover:bg-[#9A7209] transition-all shadow-md flex items-center gap-2" href="search.html">
        <i class="fa-solid fa-magnifying-glass text-sm">
        </i>
        Shop
       </a>
      </div>
     </div>
    </div>
   </nav>
  </header>
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full py-16">
   <div class="text-center mb-16 reveal active">
    <p class="text-[10px] font-bold tracking-[0.3em] uppercase text-[#B8860B] mb-4">
     Personal Archive
    </p>
    <h1 class="text-5xl md:text-6xl text-gray-900 mb-6">
     Your
     <em>
      Collection
     </em>
    </h1>
    <p class="text-gray-500 max-w-2xl mx-auto italic">
     Masterpieces you have saved from the heritage archive. Preserving India's finest crafts.
    </p>
   </div>
   <!-- Collection Grid -->
   <div class="product-grid" id="product-grid">
   </div>
  </main>
  <!-- Footer -->
  <footer class="bg-[#1A1A1A] text-white/50 py-12 text-xs border-t border-white/10 mt-auto text-center">
   © 2026 HERITAGE EDITORIAL. PRESERVING CRAFTSMANSHIP.
  </footer>
  <script src="js/components.js"></script>
  <script src="js/nav.js"></script>
  <script>
   // Handle auth state gracefully
    const token = localStorage.getItem('token');
    if (!token) {
      renderUnauthenticatedState();
    } else {
      fetchCollection();
    }

    function renderUnauthenticatedState() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = `
        <div class="col-span-full py-20 flex flex-col items-center justify-center text-center px-4">
          <div class="w-16 h-16 rounded-full bg-[#F5F1E8] flex items-center justify-center mb-6">
            <i class="fa-solid fa-user-lock text-2xl text-[#B8860B]"></i>
          </div>
          <h2 class="font-serif text-3xl text-gray-900 mb-3">Sign In to View Your Archive</h2>
          <p class="text-gray-500 mb-8 max-w-md">Your personal collection is tied to your account. Sign in to view and manage your saved heritage masterpieces.</p>
          <div class="flex flex-col sm:flex-row gap-4">
            <a href="login.html" class="bg-[#B8860B] text-white px-8 py-3 text-[10px] font-bold tracking-widest uppercase hover:bg-[#9A7008] transition-colors shadow-lg flex items-center justify-center gap-2">
              <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i> Sign In to Account
            </a>
            <a href="search.html" class="border border-gray-300 text-gray-700 px-8 py-3 text-[10px] font-bold tracking-widest uppercase hover:border-[#B8860B] hover:text-[#B8860B] transition-colors flex items-center justify-center">
              Explore Masterpieces
            </a>
          </div>
        </div>
      `;
    }

    async function fetchCollection() {
      const authToken = localStorage.getItem('token');
      if (!authToken) {
        renderUnauthenticatedState();
        return;
      }

      const grid = document.getElementById('product-grid');
      
      grid.innerHTML = '<div class="col-span-full py-20 text-center font-serif text-xl opacity-50">Retrieving your personal archive... 🏺</div>';

      try {
        const response = await fetch(`${window.GLOBAL_API_BASE}/api/auth/collection`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        
        if (!response.ok) throw new Error('Failed to load collection');
        
        const products = await response.json();
        
        if (products.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full py-20 flex flex-col items-center justify-center text-center">
              <i class="fa-regular fa-heart text-4xl text-gray-300 mb-6"></i>
              <h2 class="font-serif text-2xl text-gray-900 mb-2">Your collection is empty</h2>
              <p class="text-gray-500 mb-8 max-w-md">Discover authentic heritage crafts from 28 states and save them to your personal archive.</p>
              <a href="search.html" class="bg-[#B8860B] text-white px-8 py-3 text-[10px] font-bold tracking-widest uppercase hover:bg-[#9A7008] transition-colors shadow-lg">Explore Masterpieces</a>
            </div>
          `;
          return;
        }

        // Design Decision: Staggered entrance (${i * 100}ms) gives a tactile, hand-curated
        // gallery cadence as artifacts load sequentially rather than popping in simultaneously.
        grid.innerHTML = products.map((p, i) => `
          <div class="product-card reveal active" style="transition-delay: ${i * 100}ms" onclick="location.href='masterpiece.html?id=${p._id}'">
            <div class="product-card-img">
              <button onclick="event.stopPropagation(); removeFromCollection('${p._id}', this)" class="absolute top-3 right-3 z-20 w-8 h-8 rounded-full bg-white/90 backdrop-blur-sm flex items-center justify-center text-red-500 hover:text-red-700 transition-colors shadow-sm">
                <i class="fa-solid fa-heart"></i>
              </button>
              <img src="${p.imageUrl}" alt="${p.name}" loading="lazy">
            </div>
            <div class="product-card-body">
              <p class="product-state">${p.state}</p>
              <p class="product-name">${p.name}</p>
              <div class="product-footer">
                <span class="product-craft">${p.craft}</span>
                <span class="product-price">₹ ${p.price.toLocaleString('en-IN')}</span>
              </div>
            </div>
          </div>
        `).join('');

      } catch (error) {
        grid.innerHTML = `
          <div class="col-span-full py-24 flex flex-col items-center justify-center text-center px-4">
            <div class="w-16 h-16 rounded-full bg-[#F5F1E8] flex items-center justify-center mb-6">
              <i class="fa-solid fa-wifi text-2xl text-[#C19A6B]"></i>
            </div>
            <h2 class="font-serif text-2xl text-gray-900 mb-3">Archive Currently Offline</h2>
            <p class="text-gray-500 mb-2 max-w-sm">We couldn't connect to the heritage archive. This may be a temporary network issue.</p>
            <p class="text-gray-400 text-sm mb-8 max-w-sm">Please check your internet connection and try again, or browse available masterpieces.</p>
            <div class="flex flex-col sm:flex-row gap-4">
              <button onclick="fetchCollection()" class="bg-[#B8860B] text-white px-8 py-3 text-[10px] font-bold tracking-widest uppercase hover:bg-[#9A7008] transition-colors shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right text-xs"></i> Try Again
              </button>
              <a href="search.html" class="border border-gray-300 text-gray-700 px-8 py-3 text-[10px] font-bold tracking-widest uppercase hover:border-[#B8860B] hover:text-[#B8860B] transition-colors flex items-center justify-center">
                Browse Masterpieces
              </a>
            </div>
          </div>
        `;
        console.error(error);
      }
    }

    async function removeFromCollection(id, btn) {
      if (!confirm('Remove this masterpiece from your collection?')) return;
      
      const token = localStorage.getItem('token');
      try {
        const response = await fetch(`${window.GLOBAL_API_BASE}/api/auth/collection/${id}`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (response.ok) {
          // Remove card from UI
          const card = btn.closest('.product-card');
          card.style.opacity = 0;
          card.style.transform = 'scale(0.9)';
          setTimeout(() => {
            fetchCollection(); // Refresh collection
          }, 300);
        }
      } catch (error) {
        console.error('Error removing item:', error);
      }
    }
  </script>
 </body>
</html>
